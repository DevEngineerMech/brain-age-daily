
workflows:
  ios-workflow:
    name: Brain Age Daily - iOS App Store
    max_build_duration: 120

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.rork.brain-age-daily

    scripts:
      - name: Verify release information
        script: |
          set -e

          echo "======================================"
          echo "BRAIN AGE DAILY - iOS RELEASE"
          echo "======================================"

          echo "Current Git commit:"
          git log -1 --oneline

          echo "Flutter version:"
          flutter --version

          echo "Xcode version:"
          xcodebuild -version

          echo "App version:"
          grep "^version:" pubspec.yaml

          echo "App bundle identifier:"
          echo "app.rork.brain-age-daily"

          echo "Checking required files..."

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f ios/Podfile
          test -f assets/images/BrainAgeDailyIcon.png

          echo "Required project files found."

      - name: Configure Flutter for CocoaPods
        script: |
          set -e

          flutter config --no-enable-swift-package-manager

      - name: Flutter clean and install packages
        script: |
          set -e

          flutter clean
          flutter pub get

      - name: Generate app icons
        script: |
          set -e

          dart run flutter_launcher_icons

      - name: Install iOS CocoaPods
        script: |
          set -e

          cd ios
          pod install
          cd ..

      - name: Configure iOS code signing
        script: |
          set -e

          keychain initialize

          app-store-connect fetch-signing-files \
            app.rork.brain-age-daily \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates

          xcode-project use-profiles

      - name: Build signed iOS IPA
        script: |
          set -e

          echo "Building Brain Age Daily..."
          echo "Version: 1.0.24"

          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist

          echo "Checking exported IPA..."

          ls -lh build/ios/ipa/

          test -n "$(find build/ios/ipa -name '*.ipa' -print -quit)"

          echo "iOS IPA created successfully."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
