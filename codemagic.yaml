
workflows:
  ios-workflow:
    name: Brain Age Daily - iOS App Store
    max_build_duration: 120

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.rork.brain-age-daily

    scripts:
      - name: Install Flutter dependencies
        script: |
          set -e

          flutter config --no-enable-swift-package-manager

          flutter pub get

      - name: Configure iOS deployment target
        script: |
          set -e

          echo "Configuring iOS 15.0 deployment target"

          ruby <<'RUBY'
          path = 'ios/Runner.xcodeproj/project.pbxproj'

          content = File.read(path)

          content.gsub!(
            /IPHONEOS_DEPLOYMENT_TARGET\s*=\s*[0-9.]+;/,
            'IPHONEOS_DEPLOYMENT_TARGET = 15.0;'
          )

          File.write(path, content)
          RUBY

      - name: Refresh Flutter iOS plugin links
        script: |
          set -e

          echo "Removing stale CocoaPods plugin links"

          rm -rf ios/.symlinks
          rm -rf ios/Pods
          rm -f ios/Podfile.lock

          echo "Regenerating Flutter iOS configuration"

          flutter precache --ios
          flutter pub get

          flutter build ios --config-only --release

          echo "Checking Firebase plugin registration"

          grep -n "flutter_install_all_ios_pods" ios/Podfile

          echo "Checking firebase_core dependency"

          grep -A 5 "firebase_core:" pubspec.lock

      - name: Configure iOS code signing
        script: |
          set -e

          echo "Using existing Codemagic signing profiles"

          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          set -e

          echo "Building Brain Age Daily 1.0.24"

          flutter build ipa \
            --release \
            --build-name=1.0.24 \
            --build-number=7 \
            --export-options-plist=/Users/builder/export_options.plist

          echo "Checking IPA output"

          ls -lh build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
