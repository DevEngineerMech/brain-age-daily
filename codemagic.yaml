
workflows:
  ios-workflow:
    name: Brain Age Daily - iOS App Store
    max_build_duration: 120

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.rork.brain-age-daily

    scripts:
      - name: Verify release information
        script: |
          set -e

          echo "======================================"
          echo "BRAIN AGE DAILY - iOS RELEASE"
          echo "======================================"

          echo "Current Git commit:"
          git log -1 --oneline

          echo "Flutter version:"
          flutter --version

          echo "Xcode version:"
          xcodebuild -version

          echo "App version:"
          grep "^version:" pubspec.yaml

          echo "App bundle identifier:"
          echo "app.rork.brain-age-daily"

          echo "======================================"
          echo "PROJECT FILE CHECK"
          echo "======================================"

          for file in \
            pubspec.yaml \
            lib/main.dart \
            ios/Podfile \
            ios/Runner.xcodeproj/project.pbxproj \
            assets/images/BrainAgeDailyIcon.png
          do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
            fi
          done

          echo "======================================"
          echo "VERIFICATION COMPLETE"
          echo "======================================"

      - name: Configure Flutter
        script: |
          set -e

          flutter config --no-enable-swift-package-manager

      - name: Install Flutter dependencies
        script: |
          set -e

          flutter clean
          flutter pub get

      - name: Generate app icons
        script: |
          set -e

          if [ -f "assets/images/BrainAgeDailyIcon.png" ]; then
            echo "App icon source found."
            dart run flutter_launcher_icons
          else
            echo "App icon source not found at the expected path."
            echo "Keeping existing iOS app icons."
          fi

      - name: Check iOS project
        script: |
          set -e

          if [ ! -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            echo "ERROR: iOS Xcode project is missing."
            echo "The repository must contain the existing ios folder."
            exit 1
          fi

          if [ ! -f "ios/Podfile" ]; then
            echo "WARNING: ios/Podfile is missing."
            echo "Flutter will be asked to prepare iOS configuration."
            flutter build ios --config-only --release
          fi

          if [ ! -f "ios/Podfile" ]; then
            echo "ERROR: ios/Podfile is still missing."
            echo "Restore the original Podfile before building."
            exit 1
          fi

      - name: Install CocoaPods
        script: |
          set -e

          cd ios
          pod install
          cd ..

      - name: Configure iOS code signing
        script: |
          set -e

          keychain initialize

          app-store-connect fetch-signing-files \
            app.rork.brain-age-daily \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates

          xcode-project use-profiles

      - name: Build signed iOS IPA
        script: |
          set -e

          echo "======================================"
          echo "BUILDING BRAIN AGE DAILY"
          echo "Version 1.0.24"
          echo "======================================"

          if [ -f "/Users/builder/export_options.plist" ]; then
            flutter build ipa \
              --release \
              --export-options-plist=/Users/builder/export_options.plist
          else
            echo "Export options not generated."
            echo "Attempting Flutter IPA export using signing configuration."

            flutter build ipa --release
          fi

          echo "======================================"
          echo "CHECKING IPA"
          echo "======================================"

          ls -lh build/ios/ipa/

          if ! find build/ios/ipa \
            -name "*.ipa" \
            -print -quit | grep -q .; then
            echo "ERROR: No IPA was generated."
            exit 1
          fi

          echo "IPA successfully generated."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
