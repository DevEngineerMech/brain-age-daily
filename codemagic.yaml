
workflows:
  ios-workflow:
    name: Brain Age Daily - iOS App Store
    max_build_duration: 120

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.rork.brain-age-daily

    scripts:
      - name: Verify release information
        script: |
          set -e

          echo "======================================"
          echo "BRAIN AGE DAILY - IOS RELEASE"
          echo "======================================"

          echo "Git commit:"
          git log -1 --oneline

          echo "Flutter version:"
          flutter --version

          echo "Xcode version:"
          xcodebuild -version

          echo "App version:"
          grep "^version:" pubspec.yaml

          echo "Bundle identifier:"
          echo "app.rork.brain-age-daily"

          echo "Checking required project files..."

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f ios/Podfile
          test -f ios/Runner.xcodeproj/project.pbxproj

          echo "Required files verified."

      - name: Configure Flutter
        script: |
          set -e

          flutter config --no-enable-swift-package-manager

      - name: Install Flutter dependencies
        script: |
          set -e

          flutter clean
          flutter pub get

      - name: Generate app icons
        script: |
          set -e

          if [ -f "assets/images/BrainAgeDailyIcon.png" ]; then
            echo "Generating app icons..."
            dart run flutter_launcher_icons
          else
            echo "Using existing iOS app icons."
          fi

      - name: Configure iOS deployment target
        script: |
          set -e

          echo "======================================"
          echo "SETTING MINIMUM IOS VERSION TO 15.0"
          echo "======================================"

          grep "platform :ios, '15.0'" ios/Podfile

          ruby <<'RUBY'
          path = 'ios/Runner.xcodeproj/project.pbxproj'

          content = File.read(path)

          matches = content.scan(
            /IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/
          ).length

          puts "Found #{matches} deployment target settings."

          content.gsub!(
            /IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/,
            'IPHONEOS_DEPLOYMENT_TARGET = 15.0;'
          )

          File.write(path, content)

          puts "Runner deployment target set to 15.0."
          RUBY

          echo "Final deployment targets:"
          grep "IPHONEOS_DEPLOYMENT_TARGET" \
            ios/Runner.xcodeproj/project.pbxproj || true

      - name: Install CocoaPods
        script: |
          set -e

          echo "======================================"
          echo "INSTALLING COCOAPODS"
          echo "======================================"

          cd ios
          pod install --repo-update
          cd ..

          echo "CocoaPods installation successful."

      - name: Configure existing iOS signing profiles
        script: |
          set -e

          echo "======================================"
          echo "USING CODEMAGIC SIGNING IDENTITIES"
          echo "======================================"

          echo "Bundle ID: app.rork.brain-age-daily"
          echo "Distribution type: App Store"

          echo "Available provisioning profiles:"

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          if [ -d "$PROFILE_DIR" ]; then
            find "$PROFILE_DIR" \
              -maxdepth 1 \
              -type f \
              -print
          else
            echo "No provisioning profile directory found."
          fi

          echo "Applying Codemagic signing profiles..."

          xcode-project use-profiles

          echo "Code signing configuration applied."

      - name: Build signed iOS IPA
        script: |
          set -e

          echo "======================================"
          echo "BUILDING BRAIN AGE DAILY 1.0.24"
          echo "======================================"

          if [ -f "/Users/builder/export_options.plist" ]; then

            echo "Using generated App Store export options."

            flutter build ipa \
              --release \
              --export-options-plist=/Users/builder/export_options.plist

          else

            echo "Using Flutter IPA export."

            flutter build ipa --release

          fi

          echo "======================================"
          echo "CHECKING IPA OUTPUT"
          echo "======================================"

          ls -lh build/ios/ipa/

          if ! find build/ios/ipa \
            -name "*.ipa" \
            -print -quit | grep -q .; then

            echo "ERROR: No IPA was generated."
            exit 1

          fi

          echo "IPA successfully created."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
