
workflows:
  ios-workflow:
    name: Brain Age Daily - iOS App Store
    max_build_duration: 120

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.rork.brain-age-daily

    scripts:
      - name: Install Flutter dependencies
        script: |
          set -e

          flutter config --no-enable-swift-package-manager
          flutter precache --ios
          flutter pub get

      - name: Generate Brain Age Daily app icons
        script: |
          set -e

          echo "Generating app icons"

          if [ ! -f "assets/images/BrainAgeDailyIcon.png" ]; then
            echo "ERROR: App icon image not found!"
            exit 1
          fi

          dart run flutter_launcher_icons

          echo "Checking generated iOS app icon"

          ICON_PATH="ios/Runner/Assets.xcassets/AppIcon.appiconset"

          if [ ! -s "$ICON_PATH/Icon-App-1024x1024@1x.png" ]; then
            echo "ERROR: iOS app icon was not generated!"
            exit 1
          fi

          echo "Brain Age Daily app icons generated successfully"

      - name: Configure iOS deployment target
        script: |
          set -e

          echo "Setting iOS minimum version to 15.0"

          ruby <<'RUBY'
          path = 'ios/Runner.xcodeproj/project.pbxproj'
          content = File.read(path)

          content.gsub!(
            /IPHONEOS_DEPLOYMENT_TARGET\s*=\s*[0-9.]+;/,
            'IPHONEOS_DEPLOYMENT_TARGET = 15.0;'
          )

          File.write(path, content)
          RUBY

      - name: Install iOS dependencies
        script: |
          set -e

          echo "Installing Firebase and other iOS plugins"

          cd ios

          pod install --repo-update

          cd ..

          echo "iOS dependencies installed"

      - name: Configure Apple code signing
        script: |
          set -e

          echo "Using existing Codemagic App Store signing identities"

          xcode-project use-profiles

          echo "Signing profiles configured"

      - name: Build iOS IPA
        script: |
          set -e

          echo "Building Brain Age Daily 1.0.24 Build 8"

          flutter build ipa \
            --release \
            --build-name=1.0.24 \
            --build-number=8 \
            --export-options-plist=/Users/builder/export_options.plist

          echo "Checking generated IPA"

          ls -lh build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
