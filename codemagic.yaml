
workflows:
  ios-workflow:
    name: Brain Age Daily - iOS App Store
    max_build_duration: 120

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.rork.brain-age-daily

    scripts:
      - name: Verify release information
        script: |
          set -e

          echo "======================================"
          echo "BRAIN AGE DAILY - iOS RELEASE"
          echo "======================================"

          echo "Current Git commit:"
          git log -1 --oneline

          echo "Flutter version:"
          flutter --version

          echo "Xcode version:"
          xcodebuild -version

          echo "App version:"
          grep "^version:" pubspec.yaml

          echo "Bundle ID:"
          echo "app.rork.brain-age-daily"

          echo "Checking required source files..."

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f ios/Runner.xcodeproj/project.pbxproj

          echo "Source files verified."

      - name: Configure Flutter
        script: |
          set -e

          flutter config --no-enable-swift-package-manager

      - name: Install Flutter dependencies
        script: |
          set -e

          flutter clean
          flutter pub get

      - name: Generate app icons
        script: |
          set -e

          if [ -f "assets/images/BrainAgeDailyIcon.png" ]; then
            echo "Generating iOS app icons..."
            dart run flutter_launcher_icons
          else
            echo "Icon source not found."
            echo "Keeping the existing app icons."
          fi

      - name: Configure iOS deployment target
        script: |
          set -e

          echo "======================================"
          echo "SETTING MINIMUM iOS VERSION TO 15.0"
          echo "======================================"

          if [ ! -f "ios/Podfile" ]; then
            echo "ERROR: ios/Podfile is missing."
            echo "Commit the Podfile supplied with this fix."
            exit 1
          fi

          echo "Checking Podfile platform..."

          grep "platform :ios, '15.0'" ios/Podfile

          echo "Updating Runner Xcode deployment targets..."

          ruby <<'RUBY'
          path = 'ios/Runner.xcodeproj/project.pbxproj'

          content = File.read(path)

          matches = content.scan(
            /IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/
          ).length

          puts "Found #{matches} deployment target settings."

          content.gsub!(
            /IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/,
            'IPHONEOS_DEPLOYMENT_TARGET = 15.0;'
          )

          File.write(path, content)

          puts "Runner deployment target set to iOS 15.0."
          RUBY

          echo "Final deployment target values:"
          grep "IPHONEOS_DEPLOYMENT_TARGET" \
            ios/Runner.xcodeproj/project.pbxproj || true

      - name: Install CocoaPods
        script: |
          set -e

          echo "======================================"
          echo "INSTALLING iOS PODS"
          echo "======================================"

          cd ios

          pod install --repo-update

          echo "CocoaPods installation successful."

          cd ..

      - name: Configure iOS code signing
        script: |
          set -e

          echo "======================================"
          echo "CONFIGURING APP STORE CODE SIGNING"
          echo "======================================"

          keychain initialize

          app-store-connect fetch-signing-files \
            app.rork.brain-age-daily \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates

          xcode-project use-profiles

      - name: Build signed iOS IPA
        script: |
          set -e

          echo "======================================"
          echo "BUILDING BRAIN AGE DAILY 1.0.24"
          echo "======================================"

          if [ -f "/Users/builder/export_options.plist" ]; then
            flutter build ipa \
              --release \
              --export-options-plist=/Users/builder/export_options.plist
          else
            flutter build ipa --release
          fi

          echo "Checking IPA output..."

          ls -lh build/ios/ipa/

          if ! find build/ios/ipa \
            -name "*.ipa" \
            -print -quit | grep -q .; then

            echo "ERROR: IPA not found."
            exit 1
          fi

          echo "======================================"
          echo "IPA CREATED SUCCESSFULLY"
          echo "======================================"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
