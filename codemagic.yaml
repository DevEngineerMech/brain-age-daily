
workflows:
  ios-workflow:
    name: Brain Age Daily - iOS App Store
    max_build_duration: 120

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.rork.brain-age-daily

    scripts:
      - name: Install Flutter dependencies
        script: |
          set -e
          flutter pub get

      - name: Set iOS deployment target
        script: |
          set -e

          echo "Configuring iOS 15.0 minimum deployment target"

          if [ -f ios/Podfile ]; then
            ruby <<'RUBY'
          path = 'ios/Podfile'
          content = File.read(path)

          if content.match?(/^\s*#?\s*platform\s+:ios\s*,/)
            content.gsub!(
              /^\s*#?\s*platform\s+:ios\s*,[^\n]*/,
              "platform :ios, '15.0'"
            )
          else
            content = "platform :ios, '15.0'\n" + content
          end

          File.write(path, content)
          RUBY
          fi

          if [ -f ios/Runner.xcodeproj/project.pbxproj ]; then
            ruby <<'RUBY'
          path = 'ios/Runner.xcodeproj/project.pbxproj'
          content = File.read(path)

          content.gsub!(
            /IPHONEOS_DEPLOYMENT_TARGET\s*=\s*[0-9.]+;/,
            'IPHONEOS_DEPLOYMENT_TARGET = 15.0;'
          )

          File.write(path, content)
          RUBY
          fi

          echo "iOS deployment target configured"

      - name: Install CocoaPods
        script: |
          set -e

          cd ios
          pod install --repo-update
          cd ..

      - name: Configure iOS code signing
        script: |
          set -e

          echo "Using existing Codemagic signing identities"
          echo "Bundle ID: app.rork.brain-age-daily"

          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          set -e

          echo "Building Brain Age Daily 1.0.24"

          flutter build ipa \
            --release \
            --build-name=1.0.24 \
            --build-number=7 \
            --export-options-plist=/Users/builder/export_options.plist

          echo "iOS IPA build completed"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
